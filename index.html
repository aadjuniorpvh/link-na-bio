const $=id=>document.getElementById(id);let deferredPrompt=null,reg=null;const seenKey='junior-dias-seen-news-v1';const lastSeen=()=>{try{return JSON.parse(localStorage.getItem(seenKey)||'[]')}catch{return []}};let currentNews=[];
function refreshBadge(){const unread=currentNews.filter(n=>!lastSeen().includes(n.id)).length;$('dot').classList.toggle('on',unread>0);if('setAppBadge'in navigator){if(unread)navigator.setAppBadge(unread).catch(()=>{});else navigator.clearAppBadge().catch(()=>{})}}
function showNews(){const seen=lastSeen();$('news').replaceChildren();if(!currentNews.length){let p=document.createElement('p');p.textContent='Nenhuma novidade publicada.';$('news').append(p)}currentNews.forEach(n=>{let box=document.createElement('article');box.className='notice';let title=document.createElement('h2');title.textContent=n.title+(seen.includes(n.id)?'':' • Novo');let desc=document.createElement('p');desc.textContent=n.message;let date=document.createElement('time');date.textContent=n.date||'';box.append(title,desc,date);if(n.url&&/^https:\/\//.test(n.url)){let a=document.createElement('a');a.href=n.url;a.target='_blank';a.rel='noopener';a.textContent='Saiba mais';a.style.display='block';box.append(a)}$('news').append(box)});localStorage.setItem(seenKey,JSON.stringify([...new Set([...seen,...currentNews.map(n=>n.id)])]));refreshBadge()}
$('bell').addEventListener('click',()=>{const opening=$('panel').classList.contains('hidden');$('panel').classList.toggle('hidden',!opening);$('bell').setAttribute('aria-expanded',String(opening));if(opening)showNews()});$('close').addEventListener('click',()=>{$('panel').classList.add('hidden');$('bell').setAttribute('aria-expanded','false')});
async function checkNews(){try{const r=await fetch('./novidades.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Sem conexão');const data=await r.json();currentNews=Array.isArray(data.items)?data.items.filter(n=>typeof n.id==='string'&&typeof n.title==='string'&&typeof n.message==='string'):[];refreshBadge();if(!$('panel').classList.contains('hidden'))showNews()}catch(e){console.info('Novidades indisponíveis temporariamente',e)}}checkNews();document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkNews();reg?.update().catch(()=>{})}});
$('contact').addEventListener('click',()=>{const v='BEGIN:VCARD\r\nVERSION:3.0\r\nFN:Junior Dias\r\nN:Dias;Junior;;;\r\nTEL;TYPE=CELL:+5569984835944\r\nURL:https://www.zyroweb.com.br\r\nEND:VCARD\r\n';const u=URL.createObjectURL(new Blob([v],{type:'text/vcard;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='junior-dias.vcf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=$('install').disabled?null:e});window.addEventListener('appinstalled',()=>{$('installHelp').textContent='Cartão digital instalado!';$('installHelp').classList.remove('hidden');deferredPrompt=null});$('install').addEventListener('click',async()=>{if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;await p.prompt();return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);$('installHelp').textContent=ios?'No Safari: toque em Compartilhar e depois em “Adicionar à Tela de Início”.':'No menu do navegador, procure “Instalar aplicativo” ou “Adicionar à tela inicial”. A instalação depende do navegador e do HTTPS.';$('installHelp').classList.remove('hidden')});
if('serviceWorker'in navigator){window.addEventListener('load',async()=>{try{reg=await navigator.serviceWorker.register('./service-worker.js');reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)$('updateBanner').classList.remove('hidden')})});if(reg.waiting&&navigator.serviceWorker.controller)$('updateBanner').classList.remove('hidden')}catch(e){console.warn('Service worker não registrado',e)}});let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}})}$('updateNow').addEventListener('click',()=>{if(reg?.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload()});
