<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11143a">
  <meta name="description" content="Cartão de visitas digital de Junior Dias. Entre em contato e conheça meus canais.">
  <title>Junior Dias | Cartão Digital</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Junior Dias">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==== DESIGN ORIGINAL DO CÓDIGO 2 ==== */
    :root{color-scheme:dark;--white:#fff;--muted:#d7d8f2;--line:rgba(255,255,255,.20)}
    *{box-sizing:border-box}html{min-height:100%;background:#11143a}body{margin:0;min-height:100vh;font-family:Outfit,system-ui,-apple-system,sans-serif;color:var(--white);background:radial-gradient(circle at 13% 8%,#8c38ed 0%,transparent 35%),radial-gradient(circle at 90% 23%,#ff3d96 0%,transparent 32%),radial-gradient(circle at 45% 95%,#1671ff 0%,transparent 50%),linear-gradient(150deg,#15103f,#251457 55%,#101e57);background-attachment:fixed}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 65% 60%,rgba(255,255,255,.09),transparent 45%)}
    .wrap{position:relative;width:min(100% - 32px,440px);margin:0 auto;padding:42px 0 38px;text-align:center}
    .avatar{display:block;width:132px;height:132px;object-fit:cover;border-radius:50%;border:5px solid rgba(255,255,255,.9);box-shadow:0 12px 45px rgba(8,8,43,.38),0 0 0 8px rgba(255,255,255,.13);margin:0 auto 21px}
    h1{font-size:clamp(30px,8vw,39px);letter-spacing:.075em;margin:0;font-weight:800;line-height:1.2;text-shadow:0 3px 16px rgba(0,0,0,.14)}
    .subtitle{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:9px 0 27px;font-weight:500}
    .video{border:1px solid rgba(255,255,255,.25);padding:7px;border-radius:21px;background:rgba(255,255,255,.13);box-shadow:0 14px 32px rgba(0,0,0,.18);backdrop-filter:blur(12px);margin-bottom:25px}
    .video iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#09091b}
    .buttons{display:grid;gap:13px}.btn{display:flex;align-items:center;justify-content:center;min-height:62px;position:relative;border-radius:19px;padding:14px 50px;text-decoration:none;font-size:17px;font-weight:700;color:white;border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 20px rgba(11,12,44,.19);transition:transform .2s,filter .2s,box-shadow .2s;cursor:pointer;font-family:inherit}
    .btn:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:0 12px 24px rgba(11,12,44,.27)}.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}.btn svg{position:absolute;left:20px;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .whatsapp{background:linear-gradient(110deg,#13bc72,#05a94e)}.contact{background:linear-gradient(110deg,#4d8bff,#6253ee)}.website{background:linear-gradient(110deg,#ff914d,#f24b83)}.instagram{background:linear-gradient(110deg,#8a42df,#e44292,#ff8756)}
    .install{background:linear-gradient(110deg,#12c4db,#3567f5)}.install[hidden]{display:none}.install-note{font-size:13px;color:#e8e9ff;line-height:1.5;margin:12px 3px 0}.install-note[hidden]{display:none}.foot{font-size:12px;color:rgba(255,255,255,.75);margin-top:27px;letter-spacing:.06em}
    @media(max-width:380px){.wrap{width:min(100% - 26px,440px);padding-top:30px}.avatar{width:112px;height:112px}.btn{min-height:58px}}
    @media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}

    /* ==== ESTILOS NOVOS (funcionalidades do Código 1) ==== */
    .top{display:flex;justify-content:flex-end;margin-bottom:8px}
    .bell{position:relative;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,filter .2s;backdrop-filter:blur(10px)}
    .bell:hover{transform:translateY(-2px);filter:brightness(1.15)}
    .bell:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .dot{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:#ff3d96;box-shadow:0 0 0 3px rgba(17,20,58,.9);display:none}
    .dot.on{display:block}
    .panel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:21px;padding:18px;margin:12px 0 20px;backdrop-filter:blur(14px);text-align:left;box-shadow:0 14px 32px rgba(0,0,0,.22)}
    .panel.hidden{display:none}
    .panelTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .panelTitle h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
    .panelTitle button{background:transparent;border:0;color:#fff;font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:10px}
    .panelTitle button:hover{background:rgba(255,255,255,.15)}
    .notice{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;margin-bottom:10px}
    .notice:last-child{margin-bottom:0}
    .notice h2{margin:0 0 6px;font-size:15px;font-weight:700}
    .notice p{margin:0 0 8px;font-size:14px;line-height:1.5;color:#e8e9ff}
    .notice time{display:block;font-size:12px;color:var(--muted);letter-spacing:.03em}
    .notice a{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:#8ec5ff;text-decoration:none}
    .notice a:hover{text-decoration:underline}
    .banner{background:linear-gradient(110deg,#12c4db,#3567f5);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:14px 16px;margin:0 0 18px;font-size:14px;line-height:1.5;box-shadow:0 10px 24px rgba(11,12,44,.3)}
    .banner.hidden{display:none}
    .banner button{margin-top:10px;background:#fff;color:#11143a;border:0;border-radius:10px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
    .banner button:hover{filter:brightness(.95)}
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="wrap">
    <!-- Sino de novidades (Código 1) -->
    <div class="top">
      <button class="bell" id="bell" aria-label="Abrir novidades" aria-expanded="false">🔔<span id="dot" class="dot"></span></button>
    </div>
    <section id="panel" class="panel hidden" aria-label="Central de novidades">
      <div class="panelTitle">
        <h2>🔔 Novidades</h2>
        <button id="close" aria-label="Fechar">×</button>
      </div>
      <div id="news"></div>
    </section>
    <div id="updateBanner" class="banner hidden">
      Uma nova versão do cartão digital está disponível.<br>
      <button id="updateNow">Atualizar agora</button>
    </div>

    <!-- Conteúdo visual do Código 2 -->
    <img class="avatar" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhrhBjonA4wDYd4oZKY2II0FG62Gq7dBHeSTVHhpcfepHUNkfA96elOroafvz_U22ARCMXOrM4IyDyomcrvAqenezV5_ys7zPCnZkpppMtPVQ7aAeuX5t-ZxL21yDGBsELKYU_Gkf_TCQ7H3_HjJNagOY5mXzErAxNd1Q1I8wbQPEV0DD2l6GpIwXpUTRBv/s320/foto.jpg" alt="Foto de perfil de Junior Dias" width="132" height="132">
    <h1>JUNIOR DIAS</h1>
    <p class="subtitle">Cartão de visitas digital</p>
    <section class="video" aria-label="Vídeo de apresentação do YouTube">
      <iframe src="https://www.youtube-nocookie.com/embed/1A9jo8zP2Tg?start=3935" title="Vídeo de Junior Dias no YouTube" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </section>

    <nav class="buttons" aria-label="Meus contatos e redes sociais">
      <a class="btn whatsapp" href="https://wa.me/5569984835944" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.4 7.5L3 20.5l1.4-5.1a8.5 8.5 0 1 1 16.1-3.8Z"/><path d="M8.5 8.5c.4-.4.7-.4 1-.1l1.1 1.5-.5 1.1c.6 1.2 1.6 2.2 2.9 2.8l1.1-.6 1.5 1c.4.3.3.7-.1 1.1-.8.8-1.8.9-3 .4a9.2 9.2 0 0 1-4.3-4.2c-.5-1.2-.4-2.2.3-3Z"/></svg>
        WhatsApp
      </a>
      <button class="btn contact" id="contact" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="9" r="2.5"/><path d="M7.5 17c.5-2.1 2-3.2 4.5-3.2s4 1.1 4.5 3.2"/></svg>
        Salvar contato
      </button>
      <a class="btn website" href="https://www.zyroweb.com.br" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/></svg>
        Meu site
      </a>
      <a class="btn instagram" href="https://www.instagram.com/junior.dias_music" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".7" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>
      <button class="btn install" id="installBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></svg>
        Instalar cartão digital
      </button>
    </nav>
    <p class="install-note" id="installNote" hidden role="status"></p>
    <footer class="foot">Conecte-se comigo</footer>
  </main>

  <script>
    /* ============ FUNCIONALIDADES DO CÓDIGO 1 ============ */
    const $ = id => document.getElementById(id);
    let deferredPrompt = null, reg = null;
    const seenKey = 'junior-dias-seen-news-v1';
    const lastSeen = () => { try { return JSON.parse(localStorage.getItem(seenKey) || '[]') } catch { return [] } };
    let currentNews = [];

    function refreshBadge() {
      const unread = currentNews.filter(n => !lastSeen().includes(n.id)).length;
      $('dot').classList.toggle('on', unread > 0);
      if ('setAppBadge' in navigator) {
        if (unread) navigator.setAppBadge(unread).catch(() => {});
        else navigator.clearAppBadge().catch(() => {});
      }
    }

    function showNews() {
      const seen = lastSeen();
      $('news').replaceChildren();
      if (!currentNews.length) {
        const p = document.createElement('p');
        p.textContent = 'Nenhuma novidade publicada.';
        p.style.margin = '0';
        p.style.fontSize = '14px';
        p.style.color = '#d7d8f2';
        $('news').append(p);
      }
      currentNews.forEach(n => {
        const box = document.createElement('article');
        box.className = 'notice';
        const title = document.createElement('h2');
        title.textContent = n.title + (seen.includes(n.id) ? '' : ' • Novo');
        const desc = document.createElement('p');
        desc.textContent = n.message;
        const date = document.createElement('time');
        date.textContent = n.date || '';
        box.append(title, desc, date);
        if (n.url && /^https:\/\//.test(n.url)) {
          const a = document.createElement('a');
          a.href = n.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'Saiba mais →';
          box.append(a);
        }
        $('news').append(box);
      });
      localStorage.setItem(seenKey, JSON.stringify([...new Set([...seen, ...currentNews.map(n => n.id)])]));
      refreshBadge();
    }

    $('bell').addEventListener('click', () => {
      const opening = $('panel').classList.contains('hidden');
      $('panel').classList.toggle('hidden', !opening);
      $('bell').setAttribute('aria-expanded', String(opening));
      if (opening) showNews();
    });
    $('close').addEventListener('click', () => {
      $('panel').classList.add('hidden');
      $('bell').setAttribute('aria-expanded', 'false');
    });

    async function checkNews() {
      try {
        const r = await fetch('./novidades.json?ts=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw Error('Sem conexão');
        const data = await r.json();
        currentNews = Array.isArray(data.items)
          ? data.items.filter(n => typeof n.id === 'string' && typeof n.title === 'string' && typeof n.message === 'string')
          : [];
        refreshBadge();
        if (!$('panel').classList.contains('hidden')) showNews();
      } catch (e) {
        console.info('Novidades indisponíveis temporariamente', e);
      }
    }
    checkNews();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { checkNews(); reg?.update().catch(() => {}); }
    });

    /* vCard - Salvar contato */
    $('contact').addEventListener('click', () => {
      const v = 'BEGIN:VCARD\r\nVERSION:3.0\r\nFN:Junior Dias\r\nN:Dias;Junior;;;\r\nTEL;TYPE=CELL:+5569984835944\r\nURL:https://www.zyroweb.com.br\r\nX-SOCIALPROFILE;TYPE=instagram:https://www.instagram.com/junior.dias_music\r\nEND:VCARD\r\n';
      const u = URL.createObjectURL(new Blob([v], { type: 'text/vcard;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = u; a.download = 'junior-dias.vcf';
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 10000);
    });

    /* Instalação PWA */
    const installBtn = $('installBtn');
    const installNote = $('installNote');
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (standalone) installBtn.hidden = true;

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = installBtn.disabled ? null : e;
    });
    window.addEventListener('appinstalled', () => {
      installBtn.hidden = true;
      installNote.hidden = false;
      installNote.textContent = 'Cartão digital instalado!';
      deferredPrompt = null;
    });
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        const p = deferredPrompt;
        deferredPrompt = null;
        await p.prompt();
        return;
      }
      const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
      installNote.hidden = false;
      installNote.textContent = isiOS
        ? (isSafari ? 'No Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.' : 'Abra esta página no Safari, toque em Compartilhar e escolha Adicionar à Tela de Início.')
        : 'Abra o menu do navegador e escolha Instalar aplicativo ou Adicionar à tela inicial, caso disponível.';
    });

    /* Service Worker + banner de atualização */
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', async () => {
        try {
          reg = await navigator.serviceWorker.register('./service-worker.js');
          reg.addEventListener('updatefound', () => {
            const worker = reg.installing;
            worker?.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller)
                $('updateBanner').classList.remove('hidden');
            });
          });
          if (reg.waiting && navigator.serviceWorker.controller)
            $('updateBanner').classList.remove('hidden');
        } catch (e) {
          console.warn('Service worker não registrado', e);
        }
      });
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; location.reload(); }
      });
    }
    $('updateNow').addEventListener('click', () => {
      if (reg?.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      else location.reload();
    });
  </script>
</body>
</html>
