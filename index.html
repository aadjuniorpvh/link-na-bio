<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#21134d">
    <meta name="description" content="Cartão digital de Junior Dias">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>Junior Dias | Cartão Digital</title>
    <style>
        /* Aparência original restaurada — versão com notificações */
        :root {
            color-scheme: dark;
            font-family: Outfit, Inter, system-ui, -apple-system, sans-serif;
            --white: #fff;
            --muted: #d7d8f2;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #11143a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--white);
            padding: 28px 15px 55px;
            background: radial-gradient(circle at 13% 8%, #8c38ed 0%, transparent 35%), radial-gradient(circle at 90% 23%, #ff3d96 0%, transparent 32%), radial-gradient(circle at 45% 95%, #1671ff 0%, transparent 50%), linear-gradient(150deg, #15103f, #251457 55%, #101e57);
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 65% 60%, rgba(255, 255, 255, .09), transparent 45%);
        }

        button,
        a {
            font: inherit;
        }

        .wrap {
            position: relative;
            max-width: 450px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: flex-end;
            position: relative;
            margin-bottom: 12px;
        }

        .bell {
            position: relative;
            background: rgba(255, 255, 255, .20);
            color: white;
            border: 1px solid rgba(255, 255, 255, .40);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 22px;
        }

        .dot {
            position: absolute;
            right: 8px;
            top: 7px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #ff385b;
            border: 2px solid white;
            display: none;
        }

        .dot.on {
            display: block;
        }

        .card {
            padding: 20px 20px 25px;
            text-align: center;
            background: rgba(255, 255, 255, .13);
            border: 1px solid rgba(255, 255, 255, .25);
            box-shadow: 0 14px 32px rgba(0, 0, 0, .18);
            backdrop-filter: blur(12px);
            border-radius: 28px;
        }

        .avatar {
            width: 132px;
            height: 132px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, .9);
            box-shadow: 0 12px 45px rgba(8, 8, 43, .38), 0 0 0 8px rgba(255, 255, 255, .13);
            margin: 5px auto 21px;
            display: block;
        }

        h1 {
            font-size: clamp(30px, 8vw, 39px);
            letter-spacing: .075em;
            margin: 0;
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 0 3px 16px rgba(0, 0, 0, .14);
        }

        small {
            display: block;
            font-size: 13px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 9px 0 27px;
            font-weight: 500;
        }

        .video {
            aspect-ratio: 16/9;
            width: 100%;
            border: 7px solid rgba(255, 255, 255, .13);
            border-radius: 21px;
            margin: 0 0 25px;
            background: #09091b;
            box-shadow: 0 14px 32px rgba(0, 0, 0, .18);
        }

        .links {
            display: grid;
            gap: 13px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 62px;
            position: relative;
            border-radius: 19px;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            color: white;
            border: 1px solid rgba(255, 255, 255, .22);
            box-shadow: 0 8px 20px rgba(11, 12, 44, .19);
            transition: transform .2s, filter .2s, box-shadow .2s;
            cursor: pointer;
            font-family: inherit;
        }

        .link:hover {
            transform: translateY(-3px);
            filter: brightness(1.08);
            box-shadow: 0 12px 24px rgba(11, 12, 44, .27);
        }

        .link:focus-visible,
        .bell:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

        /* Cores EXATAS dos botões da versão anterior */
        .links>.link:nth-child(1) {
            background: linear-gradient(110deg, #13bc72, #05a94e);
        }

        /* WhatsApp */
        .links>.link:nth-child(2) {
            background: linear-gradient(110deg, #4d8bff, #6253ee);
        }

        /* Salvar contato */
        .links>.link:nth-child(3) {
            background: linear-gradient(110deg, #ff914d, #f24b83);
        }

        /* Meu site */
        .links>.link:nth-child(4) {
            background: linear-gradient(110deg, #8a42df, #e44292, #ff8756);
        }

        /* Instagram */
        .links>.link.install {
            background: linear-gradient(110deg, #12c4db, #3567f5);
        }

        /* Instalar */
        .notice {
            background: #fff;
            color: #271447;
            border-radius: 17px;
            padding: 16px;
            margin: 14px 0;
            text-align: left;
            box-shadow: 0 12px 30px #0003;
        }

        .notice h2 {
            font-size: 17px;
            margin: 0 0 8px;
        }

        .notice p {
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 8px;
        }

        .notice time {
            font-size: 12px;
            color: #675c7d;
        }

        .notice button {
            background: #4d35ca;
            color: white;
            border: 0;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .panel {
            margin: 10px 0 18px;
        }

        .panelTitle {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panelTitle button {
            background: none;
            color: white;
            border: 0;
            font-size: 24px;
            cursor: pointer;
        }

        .status {
            text-align: center;
            margin: 15px 0 0;
            color: #e8e9ff;
            font-size: 13px;
            line-height: 1.5;
        }

        .banner {
            background: #fef3c7;
            color: #633c00;
            padding: 13px;
            border-radius: 14px;
            margin: 12px 0;
            font-size: 14px;
        }

        .banner button {
            border: 0;
            border-radius: 8px;
            padding: 8px;
            background: #633c00;
            color: white;
            margin-top: 8px;
            cursor: pointer;
        }

        .muted {
            opacity: .8;
        }

        footer {
            text-align: center;
            margin: 27px 0 0;
            font-size: 12px;
            color: rgba(255, 255, 255, .75);
            letter-spacing: .06em;
        }

        @media(max-width:380px) {
            .avatar {
                width: 112px;
                height: 112px;
            }

            .link {
                min-height: 58px;
            }

            .card {
                padding: 16px 14px 22px;
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .link {
                transition: none;
            }

            .link:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <main class="wrap">
        <div class="top"><button class="bell" id="bell" aria-label="Abrir novidades" aria-expanded="false">♧<span
                    id="dot" class="dot"></span></button></div>
        <section id="panel" class="panel hidden" aria-label="Central de novidades">
            <div class="panelTitle">
                <h2>🔔 Novidades</h2><button id="close" aria-label="Fechar">×</button>
            </div>
            <div id="news"></div>
        </section>
        <div id="updateBanner" class="banner hidden">Uma nova versão do cartão digital está disponível.<br><button
                id="updateNow">Atualizar agora</button></div>
        <section class="card"><img class="avatar"
                src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhrhBjonA4wDYd4oZKY2II0FG62Gq7dBHeSTVHhpcfepHUNkfA96elOroafvz_U22ARCMXOrM4IyDyomcrvAqenezV5_ys7zPCnZkpppMtPVQ7aAeuX5t-ZxL21yDGBsELKYU_Gkf_TCQ7H3_HjJNagOY5mXzErAxNd1Q1I8wbQPEV0DD2l6GpIwXpUTRBv/s320/foto.jpg"
                alt="Foto de perfil de Junior Dias">
            <h1>JUNIOR DIAS</h1><small>Cartão de visitas digital</small><iframe class="video"
                src="https://www.youtube-nocookie.com/embed/1A9jo8zP2Tg?start=3935"
                title="Vídeo de Junior Dias no YouTube"
                allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>
            <nav class="links" aria-label="Contatos"><a class="link" href="https://wa.me/5569984835944" target="_blank"
                    rel="noopener">💬 WhatsApp</a><button class="link" id="contact">👤 Salvar contato</button><a
                    class="link" href="https://www.zyroweb.com.br" target="_blank" rel="noopener">🌐 Meu site</a><a
                    class="link" href="https://www.instagram.com/junior.dias_music" target="_blank" rel="noopener">📸
                    Instagram</a><button class="link install" id="install">⬇ Instalar cartão digital</button></nav>
        </section>
        <p id="installHelp" class="status hidden"></p>
        <footer>Junior Dias • Cartão Digital NFC</footer>
    </main>
    <script>
        const $ = id => document.getElementById(id); let deferredPrompt = null, reg = null; const seenKey = 'junior-dias-seen-news-v1'; const lastSeen = () => { try { return JSON.parse(localStorage.getItem(seenKey) || '[]') } catch { return [] } }; let currentNews = [];
        function refreshBadge() { const unread = currentNews.filter(n => !lastSeen().includes(n.id)).length; $('dot').classList.toggle('on', unread > 0); if ('setAppBadge' in navigator) { if (unread) navigator.setAppBadge(unread).catch(() => { }); else navigator.clearAppBadge().catch(() => { }) } }
        function showNews() { const seen = lastSeen(); $('news').replaceChildren(); if (!currentNews.length) { let p = document.createElement('p'); p.textContent = 'Nenhuma novidade publicada.'; $('news').append(p) } currentNews.forEach(n => { let box = document.createElement('article'); box.className = 'notice'; let title = document.createElement('h2'); title.textContent = n.title + (seen.includes(n.id) ? '' : ' • Novo'); let desc = document.createElement('p'); desc.textContent = n.message; let date = document.createElement('time'); date.textContent = n.date || ''; box.append(title, desc, date); if (n.url && /^https:\/\//.test(n.url)) { let a = document.createElement('a'); a.href = n.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Saiba mais'; a.style.display = 'block'; box.append(a) } $('news').append(box) }); localStorage.setItem(seenKey, JSON.stringify([...new Set([...seen, ...currentNews.map(n => n.id)])])); refreshBadge() }
        $('bell').addEventListener('click', () => { const opening = $('panel').classList.contains('hidden'); $('panel').classList.toggle('hidden', !opening); $('bell').setAttribute('aria-expanded', String(opening)); if (opening) showNews() }); $('close').addEventListener('click', () => { $('panel').classList.add('hidden'); $('bell').setAttribute('aria-expanded', 'false') });
        async function checkNews() { try { const r = await fetch('./novidades.json?ts=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw Error('Sem conexão'); const data = await r.json(); currentNews = Array.isArray(data.items) ? data.items.filter(n => typeof n.id === 'string' && typeof n.title === 'string' && typeof n.message === 'string') : []; refreshBadge(); if (!$('panel').classList.contains('hidden')) showNews() } catch (e) { console.info('Novidades indisponíveis temporariamente', e) } } checkNews(); document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkNews(); reg?.update().catch(() => { }) } });
        $('contact').addEventListener('click', () => { const v = 'BEGIN:VCARD\r\nVERSION:3.0\r\nFN:Junior Dias\r\nN:Dias;Junior;;;\r\nTEL;TYPE=CELL:+5569984835944\r\nURL:https://www.zyroweb.com.br\r\nEND:VCARD\r\n'; const u = URL.createObjectURL(new Blob([v], { type: 'text/vcard;charset=utf-8' })); const a = document.createElement('a'); a.href = u; a.download = 'junior-dias.vcf'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 10000) });
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = $('install').disabled ? null : e }); window.addEventListener('appinstalled', () => { $('installHelp').textContent = 'Cartão digital instalado!'; $('installHelp').classList.remove('hidden'); deferredPrompt = null }); $('install').addEventListener('click', async () => { if (deferredPrompt) { const p = deferredPrompt; deferredPrompt = null; await p.prompt(); return } const ios = /iphone|ipad|ipod/i.test(navigator.userAgent); $('installHelp').textContent = ios ? 'No Safari: toque em Compartilhar e depois em “Adicionar à Tela de Início”.' : 'No menu do navegador, procure “Instalar aplicativo” ou “Adicionar à tela inicial”. A instalação depende do navegador e do HTTPS.'; $('installHelp').classList.remove('hidden') });
        if ('serviceWorker' in navigator) { window.addEventListener('load', async () => { try { reg = await navigator.serviceWorker.register('./service-worker.js'); reg.addEventListener('updatefound', () => { const worker = reg.installing; worker?.addEventListener('statechange', () => { if (worker.state === 'installed' && navigator.serviceWorker.controller) $('updateBanner').classList.remove('hidden') }) }); if (reg.waiting && navigator.serviceWorker.controller) $('updateBanner').classList.remove('hidden') } catch (e) { console.warn('Service worker não registrado', e) } }); let refreshing = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (!refreshing) { refreshing = true; location.reload() } }) } $('updateNow').addEventListener('click', () => { if (reg?.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' }); else location.reload() });
    </script>
</body>

</html>
